[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lavender"
version = "0.1.0"
description = "Open-source companion duck robot: swappable AI brain, skills layer and robot drivers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]      # also used for Ollama / vLLM / llama.cpp (OpenAI-compatible servers)
hardware = ["pyserial>=3.5"]
camera = ["opencv-python>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
lavender = "lavender.cli:main"

[tool.setuptools.packages.find]
include = ["lavender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
